name: Build XCFramework

on:
  push:
    branches: [iOS-1.0]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'

      # ⭐ 关键步骤：安装 gomobile 依赖
      - name: Install gomobile dependencies
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      # ⭐ 关键步骤：下载 mobile 包
      - name: Download mobile dependencies
        run: |
          go get -u golang.org/x/mobile/cmd/gomobile
          go get -u golang.org/x/mobile/cmd/gobind
          go mod download
          go mod tidy

      - name: Build for iOS
        run: |
          gomobile bind -target=ios -o=Mihomo.xcframework ./ios

      - name: Create archive
        run: |
          cd build
          zip -r Mihomo.xcframework.zip Mihomo.xcframework
          cd ..

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum build/Mihomo.xcframework.zip)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Checksum: $CHECKSUM"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Mihomo.xcframework.zip
          body: |
            ## XCFramework Checksum
            ```
            ${{ steps.checksum.outputs.CHECKSUM }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Package.swift
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          CHECKSUM=${{ steps.checksum.outputs.CHECKSUM }}
          
          cat > Package.swift << EOF
          // swift-tools-version:5.9
          import PackageDescription
          
          let package = Package(
              name: "Mihomo",
              platforms: [
                  .iOS(.v15)
              ],
              products: [
                  .library(
                      name: "Mihomo",
                      targets: ["Mihomo"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "Mihomo",
                      url: "https://github.com/${{ github.repository }}/releases/download/${TAG}/Mihomo.xcframework.zip",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: update Package.swift for ${TAG}"
          git push
