name: Build XCFramework

on:
  push:
    branches: [iOS-1.0]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true

jobs:
  build:
    runs-on: macos-14

    env:
      # ⭐ 关键：显式设置 GOPATH
      GOPATH: /Users/runner/go
      GOBIN: /Users/runner/go/bin

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'


      # ⭐ 关键：先清理缓存
      - name: Clean cache
        run: |
          go clean -modcache
          rm -rf $(go env GOPATH)/bin/gomobile
          rm -rf $(go env GOPATH)/bin/gobind

      # ⭐ 直接用 go install，不用 go mod download
      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          export PATH=$PATH:$(go env GOPATH)/bin
          which gomobile
          which gobind

      # ⭐ 初始化
      - name: Init gomobile
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init -v

      # ⭐ 下载你项目的依赖（不包括 mobile）
      - name: Download project dependencies
        run: |
          go mod tidy
          go mod download

      # ⭐ 编译
      - name: Build iOS framework
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export GOPATH=$(go env GOPATH)
          gomobile bind -v -target=ios -o=Mihomo.xcframework ./ios

      - name: Create archive
        run: |
          cd build
          zip -r Mihomo.xcframework.zip Mihomo.xcframework
          cd ..

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum build/Mihomo.xcframework.zip)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Checksum: $CHECKSUM"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Mihomo.xcframework.zip
          body: |
            ## XCFramework Checksum
            ```
            ${{ steps.checksum.outputs.CHECKSUM }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Package.swift
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          CHECKSUM=${{ steps.checksum.outputs.CHECKSUM }}
          
          cat > Package.swift << EOF
          // swift-tools-version:5.9
          import PackageDescription
          
          let package = Package(
              name: "Mihomo",
              platforms: [
                  .iOS(.v15)
              ],
              products: [
                  .library(
                      name: "Mihomo",
                      targets: ["Mihomo"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "Mihomo",
                      url: "https://github.com/${{ github.repository }}/releases/download/${TAG}/Mihomo.xcframework.zip",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: update Package.swift for ${TAG}"
          git push
