name: Build XCFramework

on:
  push:
    branches: [iOS-1.0]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true

jobs:
  build:
    runs-on: macos-14

    env:
      # ⭐ 关键：显式设置 GOPATH
      GOPATH: /Users/runner/go
      GOBIN: /Users/runner/go/bin

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'


      # ⭐ 关键：先清理缓存
      - name: Clean cache
        run: |
          go clean -modcache
          rm -rf $(go env GOPATH)/bin/gomobile
          rm -rf $(go env GOPATH)/bin/gobind

      # ⭐ 直接用 go install，不用 go mod download
      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          export PATH=$PATH:$(go env GOPATH)/bin
          which gomobile
          which gobind

      # ⭐ 初始化
      - name: Init gomobile
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init -v

      # ⭐ 下载你项目的依赖（不包括 mobile）
      - name: Download project dependencies
        run: |
          go mod tidy
          go mod download
          go get -v golang.org/x/mobile@latest

      # ⭐ 编译
      - name: Build iOS framework
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export GOPATH=$(go env GOPATH)
          gomobile bind -v -target=ios -o=Mihomo.xcframework ./ios

      # ⭐ 创建包结构
      - name: Create package structure
        run: |
          # 创建目录结构
          mkdir -p Release/Mihomo
      
          # 复制框架
          cp -r Mihomo.xcframework Release/Mihomo/
      
          # 创建 Package.swift
          cat > Release/Mihomo/Package.swift << 'EOF'
          // swift-tools-version:5.9
          import PackageDescription
      
          let package = Package(
              name: "Mihomo",
              platforms: [
                  .iOS(.v12)
              ],
              products: [
                  .library(name: "Mihomo", targets: ["Mihomo"])
              ],
              targets: [
                  .binaryTarget(
                      name: "Mihomo",
                      path: "Mihomo.xcframework"
                  )
              ]
          )
          EOF
      
          # 创建 README
          cat > Release/Mihomo/README.md << 'EOF'
          # Mihomo iOS Framework
      
          Built with gomobile from Go source code.
      
          ## Installation
      
          ### Swift Package Manager
          1. Add this repository as a package dependency
          2. Select version and target
      
          ### Manual
          1. Drag `Mihomo.xcframework` to Xcode project
          2. Select "Copy items if needed"
          3. In Build Phases, add to "Link Binary With Libraries"
          EOF

      # ⭐ 创建 ZIP 包
      - name: Create distribution package
        run: |
          cd Release
          zip -r Mihomo-iOS.zip Mihomo/
          ls -lah Mihomo-iOS.zip

      # ⭐ 上传到 Artifacts
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mihomo-iOS-Framework
          path: Release/Mihomo.xcframework/

      # ⭐ 上传 ZIP 包
      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Mihomo-iOS-Package
          path: Release/Mihomo-iOS.zip

      # ⭐ 发布到 Release（可选）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Release/Mihomo-iOS.zip
            Release/Mihomo/Mihomo.xcframework
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
